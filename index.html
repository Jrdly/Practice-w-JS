<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Tile Tactics Prototype</title>
	<link rel="stylesheet" href="style..css" />
</head>
<body>
	<div id="hud-player" class="hud-panel">
		<h1>Character</h1>
		<div id="player-stats"></div>
		<div id="player-abilities" class="abilities-panel"></div>
		<div id="message"></div>
	</div>

	<div id="game-root"></div>

	<div id="hud-enemy" class="hud-panel">
		<h1>Enemy</h1>
		<div id="enemy-stats"></div>
		<div id="enemy-abilities" class="abilities-panel"></div>
	</div>

	<div id="levelup-modal" class="hidden">
		<div class="panel">
			<h2>Level Up</h2>
			<p id="levelup-text"></p>
			<div class="row">
				<button id="hp-upgrade">+10% HP | +10% DMG</button>
				<button id="ability-upgrade">Unlock Next Ability</button>
			</div>
		</div>
	</div>

	<div id="result-modal" class="hidden">
		<div class="panel">
			<h2 id="result-title">VICTORY</h2>
			<p id="result-text"></p>
			<div class="row">
				<button id="result-close-btn">Continue</button>
			</div>
		</div>
	</div>

	<div id="controls">
		<button id="end-turn-btn">End Turn</button>
		<button id="undo-move-btn">Undo Move</button>
		<button id="restart-btn">Restart Level</button>
		<button id="clear-save-btn">Clear Save</button>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
	
	<!-- Data files -->
	<script src="data/characters.js"></script>
	<script src="data/enemies.js"></script>
	<script src="data/levels.js"></script>
	
	<!-- System files -->
	<script src="systems/pathfinding.js"></script>
	<script src="systems/combat.js"></script>
	<script src="systems/ui.js"></script>
	
	<!-- Main game script -->
	<script src="script.js"></script>
</body>
</html>
